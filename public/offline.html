<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>オフラインです | タビメモ</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Meiryo, system-ui, sans-serif;
        background: linear-gradient(180deg, #fff3ee 0%, #ebfcf9 100%);
        color: #2a2d34;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101216; color: #edeef0; }
      }
      .box { max-width: 380px; text-align: center; }
      .pin {
        width: 64px; height: 64px; margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #ff6134, #ff9f5a 45%, #13aaa1);
        display: grid; place-items: center; color: #fff; font-size: 28px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.7; opacity: 0.75; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #ff6134; color: #fff;
        padding: 12px 24px; border-radius: 999px; font-size: 15px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="pin">📍</div>
      <h1>オフラインのようです</h1>
      <p>
        電波が届かない場所にいるかもしれません。<br />
        つながったら、保存したスポットとしおりをまた見られます。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>
